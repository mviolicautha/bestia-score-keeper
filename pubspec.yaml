name: bestia_scoreboard_application
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.1
  sqflite: ^2.3.0
  path: ^1.9.0
  showcaseview: ^3.0.0
  uuid: ^4.5.2
  
  # Nuove dipendenze per il server web
  shelf: ^1.4.0
  shelf_web_socket: ^1.0.4
  network_info_plus: ^5.0.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  
  # Aggiungi gli asset per la web UI
  assets:
    - assets/web/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#1A233A" 
  adaptive_icon_foreground: "assets/icon/icon.png"
